<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Offer Sender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container { max-width: 680px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header span { font-size: 1.6rem; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }

    .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: .05em; color: #888; margin-bottom: 16px; }

    .input-row { display: flex; gap: 8px; }

    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: border-color .2s;
      outline: none;
    }
    input:focus { border-color: #25d366; }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #25d366; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-send { background: #128c7e; color: #fff; width: 100%; margin-top: 16px; padding: 13px; font-size: 1rem; }

    /* Preview */
    #preview { display: none; }
    .preview-inner { display: flex; gap: 16px; align-items: flex-start; }
    .preview-img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
      border: 1px solid #eee;
      background: #f5f5f5;
    }
    .preview-fields { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .price-row { display: flex; gap: 8px; }
    .price-row .field { flex: 1; }
    .price-original input { color: #999; text-decoration: line-through; }
    .field input.required-empty { border-color: #f0a500; background: #fffbf0; }
    .field input.required-empty::placeholder { color: #e08800; }
    .field label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 3px; }
    .field input { font-size: 0.9rem; }

    /* History */
    .history-list { list-style: none; }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .history-item:last-child { border-bottom: none; }
    .history-thumb {
      width: 44px; height: 44px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #eee;
      flex-shrink: 0;
    }
    .history-info { flex: 1; min-width: 0; }
    .history-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-meta { font-size: 0.78rem; color: #888; }
    .history-price { font-size: 0.88rem; font-weight: 600; color: #128c7e; flex-shrink: 0; }
    .empty { color: #aaa; font-size: 0.9rem; text-align: center; padding: 16px 0; }

    /* Status */
    .status { margin-top: 12px; font-size: 0.88rem; padding: 10px 14px; border-radius: 8px; display: none; }
    .status.success { background: #e8f8ef; color: #128c7e; display: block; }
    .status.error { background: #fdecea; color: #c0392b; display: block; }
    .status.loading { background: #f0f0f0; color: #555; display: block; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">

  <header>
    <span>🛍️</span>
    <h1>WhatsApp Offer Sender</h1>
  </header>

  <!-- Step 1: URL Input -->
  <div class="card">
    <h2>1. Cole o link do produto</h2>
    <div class="input-row">
      <input type="url" id="productUrl" placeholder="https://s.shopee.com.br/..." />
      <button class="btn btn-primary" id="btnScrape">Extrair</button>
    </div>
    <div class="status" id="scrapeStatus"></div>
  </div>

  <!-- Step 2: Preview & Edit -->
  <div class="card" id="preview">
    <h2>2. Revise e adicione cupom</h2>
    <div class="preview-inner">
      <img class="preview-img" id="previewImg" src="" alt="produto" />
      <div class="preview-fields">
        <div class="field">
          <label>Nome do produto</label>
          <input type="text" id="fieldName" />
        </div>
        <div class="price-row">
          <div class="field price-original">
            <label>Preço original (riscado)</label>
            <input type="text" id="fieldOriginalPrice" placeholder="R$0,00 (opcional)" />
          </div>
          <div class="field">
            <label>Preço promocional ⚠️</label>
            <input type="text" id="fieldPrice" placeholder="Preencha o preço" />
          </div>
        </div>
        <div class="field">
          <label>Cupom (opcional)</label>
          <input type="text" id="fieldCoupon" placeholder="Ex: MAMAE10" />
        </div>
        <div class="field">
          <label>Link do grupo WhatsApp</label>
          <input type="text" id="fieldGroupUrl" placeholder="https://bit.ly/seugrupo" />
        </div>
      </div>
    </div>
    <button class="btn btn-send" id="btnSend">📲 Enviar para WhatsApp</button>
    <div class="status" id="sendStatus"></div>
  </div>

  <!-- History -->
  <div class="card">
    <h2>Histórico de Envios</h2>
    <ul class="history-list" id="historyList">
      <li class="empty">Nenhum envio ainda.</li>
    </ul>
  </div>

</div>

<script>
  const $ = id => document.getElementById(id)

  function showStatus(elId, type, msg) {
    const el = $(elId)
    el.className = `status ${type}`
    el.innerHTML = type === 'loading'
      ? `<span class="spinner"></span>${msg}`
      : msg
  }

  function hideStatus(elId) {
    $(elId).className = 'status'
  }

  // Load history on page open
  loadHistory()

  async function loadHistory() {
    try {
      const res = await fetch('/api/history')
      const items = await res.json()
      renderHistory(items)
    } catch {}
  }

  function renderHistory(items) {
    const list = $('historyList')
    if (!items.length) {
      list.innerHTML = '<li class="empty">Nenhum envio ainda.</li>'
      return
    }
    list.innerHTML = items.map(item => {
      const date = new Date(item.sentAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })
      return `
        <li class="history-item">
          <img class="history-thumb" src="${item.imageUrl}" alt="" onerror="this.style.display='none'"/>
          <div class="history-info">
            <div class="history-name">${item.productName}</div>
            <div class="history-meta">${date}</div>
          </div>
          <div class="history-price">${item.price}</div>
        </li>`
    }).join('')
  }

  // Scrape product
  $('btnScrape').addEventListener('click', async () => {
    const url = $('productUrl').value.trim()
    if (!url) return

    $('btnScrape').disabled = true
    showStatus('scrapeStatus', 'loading', 'Extraindo dados do produto...')
    $('preview').style.display = 'none'

    try {
      const res = await fetch('/api/scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      })
      const data = await res.json()

      if (!res.ok) throw new Error(data.error || 'Erro ao extrair')

      $('previewImg').src = `/api/image-proxy?url=${encodeURIComponent(data.imageUrl)}`
      $('productUrl').dataset.imageUrl = data.imageUrl  // store original URL for Meta API
      $('fieldName').value = data.name
      $('fieldOriginalPrice').value = data.originalPrice || ''
      $('fieldPrice').value = data.price || ''
      $('fieldCoupon').value = ''
      $('fieldGroupUrl').value = ''
      $('preview').style.display = 'block'

      // Highlight price field if empty (Shopee blocks automated price extraction)
      const priceInput = $('fieldPrice')
      if (!data.price) {
        priceInput.classList.add('required-empty')
        priceInput.focus()
      } else {
        priceInput.classList.remove('required-empty')
      }

      hideStatus('scrapeStatus')
    } catch (err) {
      showStatus('scrapeStatus', 'error', `❌ ${err.message}`)
    } finally {
      $('btnScrape').disabled = false
    }
  })

  // Remove yellow highlight when user types price
  $('fieldPrice').addEventListener('input', () => {
    $('fieldPrice').classList.toggle('required-empty', !$('fieldPrice').value.trim())
  })

  // Send message
  $('btnSend').addEventListener('click', async () => {
    if (!$('fieldPrice').value.trim()) {
      $('fieldPrice').classList.add('required-empty')
      $('fieldPrice').focus()
      showStatus('sendStatus', 'error', '⚠️ Preencha o preço antes de enviar.')
      return
    }
    $('btnSend').disabled = true
    showStatus('sendStatus', 'loading', 'Enviando para o WhatsApp...')

    const productData = {
      name: $('fieldName').value,
      price: $('fieldPrice').value,
      originalPrice: $('fieldOriginalPrice').value || undefined,
      imageUrl: $('productUrl').dataset.imageUrl || '',
      originalUrl: $('productUrl').value,
    }

    try {
      const res = await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          productData,
          coupon: $('fieldCoupon').value,
          groupUrl: $('fieldGroupUrl').value,
        }),
      })
      const data = await res.json()

      if (!res.ok) throw new Error(data.error || 'Erro ao enviar')

      showStatus('sendStatus', 'success', '✅ Mensagem enviada! Verifique seu WhatsApp.')
      loadHistory()
    } catch (err) {
      showStatus('sendStatus', 'error', `❌ ${err.message}`)
    } finally {
      $('btnSend').disabled = false
    }
  })
</script>
</body>
</html>
